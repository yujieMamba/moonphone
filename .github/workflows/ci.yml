name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v0.1
      - run: moon fmt --check
      - run: moon check --target wasm-gc --deny-warn
      - run: moon test --target wasm-gc
      - run: moon check --target wasm --deny-warn
      - run: moon test --target wasm
